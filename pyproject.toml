[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lexideck"
version = "0.2.0"
description = "Transforme qualquer PDF em inglês em um baralho Anki com traduções em português, exemplos de uso e explicação das palavras funcionais, usando Gemini, ChatGPT ou Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "LexiDeck Contributors" }
]
keywords = ["anki", "english", "learning", "pdf", "nlp", "llm", "flashcards"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Education",
]

dependencies = [
    "pymupdf>=1.23.0",
    "spacy>=3.7.0",
    "langdetect>=1.0.9",
    "pydantic>=2.6.0",
    "genanki>=0.13.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "openai>=1.12.0",
    "google-genai>=0.1.0",
    "anthropic>=0.20.0",
    "python-dotenv>=1.0.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
    "pillow>=10.0.0",
    "gtts>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "commitizen>=3.15.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
lexideck = "lexideck.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lexideck"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
version_files = ["src/lexideck/__init__.py:__version__"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (standard Typer/FastAPI pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["lexideck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v"


